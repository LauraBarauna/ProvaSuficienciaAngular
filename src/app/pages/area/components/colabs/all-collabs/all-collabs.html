<main class="p-6 bg-(--color-bg) min-h-screen">
  <p-toast></p-toast>
  <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-2xl font-bold text-(--color-text-primary) tracking-tight">
        Equipe de Colaboradores
      </h1>
      <p class="text-sm text-(--color-text-secondary) mt-2">
        Gerencie os membros, salários e informações da sua equipe.
      </p>
    </div>

    <nav class="flex gap-3">
      <button pButton pRipple label="Novo Colaborador" icon="pi pi-plus" class="rounded-xl shadow-md"
        [routerLink]="'/app/collabs/new'"></button>
    </nav>
  </header>

  <section class="bg-(--color-surface) rounded-2xl shadow-sm border border-(--color-border) overflow-hidden">

    <p-table [value]="collaborators" [tableStyle]="{ 'min-width': '60rem' }" sortMode="multiple" #dt
      [loading]="isLoading" [paginator]="true" [rows]="5">
      <ng-template #header>
        <tr>

          <th pSortableColumn="id" style="width:20%">
            Id
            <p-sortIcon field="id" />
          </th>

          <th pSortableColumn="name">
            Nome
            <p-sortIcon field="name" />
            <p-columnFilter field="name" matchMode="in" display="menu" [showMatchModes]="false" [showOperator]="false"
              [showAddButton]="false">
              <ng-template #filter let-value let-filter="filterCallback">
                <p-multiselect [options]="collabsNames" placeholder="Filtrar Cliente" (onChange)="filter($event.value)"
                  optionLabel="label" optionValue="value" style="min-width: 14rem"></p-multiselect>
              </ng-template>
            </p-columnFilter>
          </th>

          <th pSortableColumn="age">
            Idade
            <p-sortIcon field="age" />
          </th>

          <th pSortableColumn="salary">
            Salário
            <p-sortIcon field="salary" />
          </th>

          <th></th>

        </tr>
      </ng-template>

      <ng-template #body let-collab>
        <tr>
          <td> {{ collab.id }} </td>
          <td>
            <span class="font-semibold text-gray-700">{{ collab.name }}</span>
          </td>
          <td>
            <p-tag [value]="collab.age" severity="info"></p-tag>
          </td>
          <td>
            <span class="text-green-700">
              {{ collab.salary | currency: 'BRL' }}
            </span>
          </td>
          <td>
            <p-button icon="pi pi-trash" (click)="confirmDeleteCollab(collab, $event)" severity="danger" [outlined]="true" [rounded]="true"
              class="mr-3" />
              <p-button icon="pi pi-pencil" (click)="editCollab(collab)" severity="secondary" [rounded]="true" [outlined]="true" />
            </td>
          </tr>
        </ng-template>
      </p-table>
    </section>
    <p-confirmdialog />
</main>
